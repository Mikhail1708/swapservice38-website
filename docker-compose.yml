version: '3.8'

services:
  # ============================================================
  # REDIS (ОБЯЗАТЕЛЬНЫЙ)
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: swapservice38-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # POSTGRESQL (САЙТ)
  # ============================================================
  postgres:
    image: postgres:15-alpine
    container_name: swapservice38-postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: site_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: site_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # БЭКЕНД САЙТА
  # ============================================================
  backend:
    build: ./backend
    container_name: swapservice38-backend
    restart: always
    ports:
      - "5001:5001"
    environment:
      PORT: 5001
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://site_user:${DB_PASSWORD}@postgres:5432/site_db
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      CRM_API_URL: ${CRM_API_URL:-http://crm:5000}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      CLIENT_URL: ${CLIENT_URL:-http://localhost:3001}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-0}
      PASSWORD_RESET_CODE_TTL_SECONDS: ${PASSWORD_RESET_CODE_TTL_SECONDS:-900}
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: ${PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS:-60}
      PASSWORD_RESET_MAX_ATTEMPTS: ${PASSWORD_RESET_MAX_ATTEMPTS:-5}
      PASSWORD_RESET_ATTEMPT_WINDOW_SECONDS: ${PASSWORD_RESET_ATTEMPT_WINDOW_SECONDS:-900}
      PASSWORD_RESET_IP_WINDOW_SECONDS: ${PASSWORD_RESET_IP_WINDOW_SECONDS:-900}
      PASSWORD_RESET_IP_REQUEST_MAX: ${PASSWORD_RESET_IP_REQUEST_MAX:-5}
      PASSWORD_RESET_IP_ATTEMPT_MAX: ${PASSWORD_RESET_IP_ATTEMPT_MAX:-30}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal

  # ============================================================
  # ФРОНТЕНД САЙТА
  # ============================================================
  frontend:
    build: ./frontend
    container_name: swapservice38-frontend
    restart: always
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:5001}
    depends_on:
      - backend
    networks:
      - internal

volumes:
  redis_data:
  postgres_data:

networks:
  internal:
    driver: bridge
