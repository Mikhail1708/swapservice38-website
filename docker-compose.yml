version: '3.8'

services:
  postgres-site:
    image: postgres:15
    container_name: site-db
    environment:
      POSTGRES_USER: site_user
      POSTGRES_PASSWORD: site_pass
      POSTGRES_DB: site_db
    ports:
      - "5432:5432"
    volumes:
      - site_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: site-redis
    ports:
      - "6380:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: site-backend
    ports:
      - "5001:5000"
    environment:
      DATABASE_URL: postgresql://site_user:site_pass@postgres-site:5432/site_db
      REDIS_URL: redis://redis:6379
      PORT: 5000
      CRM_API_URL: http://crm:5000   # если CRM тоже поднимем
    depends_on:
      - postgres-site
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: npm run dev

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: site-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5001
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev

volumes:
  site_pgdata: