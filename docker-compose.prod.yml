services:
  postgres:
    image: postgres:15-alpine
    container_name: swapservice38-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: site_user
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: site_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U site_user -d site_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: swapservice38-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swapservice38-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${APP_ENV:-production}
      PORT: 5001

      DATABASE_URL: postgresql://site_user:${DB_PASSWORD}@postgres:5432/site_db

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d

      CRM_API_URL: ${CRM_API_URL}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      CRM_OUTBOX_POLL_MS: 5000

      CLIENT_URL: ${CLIENT_URL}
      FRONTEND_URL: ${FRONTEND_URL}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL}
      SITE_URL: ${SITE_URL}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      TRUST_PROXY_HOPS: 1

      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      EMAIL_FROM: ${EMAIL_FROM}
      MANAGER_EMAIL: ${MANAGER_EMAIL}

      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      PAYMENT_HTTP_TIMEOUT_MS: 15000
      YOO_KASSA_SHOP_ID: ${YOO_KASSA_SHOP_ID}
      YOO_KASSA_SECRET_KEY: ${YOO_KASSA_SECRET_KEY}

      DADATA_API_KEY: ${DADATA_API_KEY}

      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      YANDEX_REDIRECT_URI: ${YANDEX_REDIRECT_URI}

      MAX_CLIENT_ID: ${MAX_CLIENT_ID}
      MAX_CLIENT_SECRET: ${MAX_CLIENT_SECRET}
      MAX_REDIRECT_URI: ${MAX_REDIRECT_URI}

      PASSWORD_RESET_CODE_TTL_SECONDS: 900
      PASSWORD_RESET_REQUEST_COOLDOWN_SECONDS: 60
      PASSWORD_RESET_MAX_ATTEMPTS: 5
      PASSWORD_RESET_ATTEMPT_WINDOW_SECONDS: 900
      PASSWORD_RESET_IP_WINDOW_SECONDS: 900
      PASSWORD_RESET_IP_REQUEST_MAX: 5
      PASSWORD_RESET_IP_ATTEMPT_MAX: 30

      REFUND_MAX_ATTEMPTS: 8
      LOG_LEVEL: info

    volumes:
      - backend_uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    networks:
      - internal

    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5001/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swapservice38-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

volumes:
  postgres_data:
  redis_data:
  backend_uploads:

networks:
  internal:
    driver: bridge
