# TLS is terminated by the existing external reverse proxy. This container is
# the frontend service built by docker-compose.yml and keeps its port 3001.
server {
    listen 3001;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    # React uses inline style attributes (gallery, comment indentation, charts).
    # Sanitized article images/API product images may be remote HTTPS URLs.
    # Payments/OAuth navigate the top-level window, they load no external SDK.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self'; connect-src 'self'; frame-src https://yandex.ru; form-action 'self'; upgrade-insecure-requests" always;

    client_max_body_size 11m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # Exact SEO resources must never use the SPA fallback, including on errors.
    location = /robots.txt { proxy_pass http://backend:5001; }
    location = /sitemap.xml { proxy_pass http://backend:5001; }
    location ^~ /sitemaps/ { proxy_pass http://backend:5001; }
    location ^~ /api/ { proxy_pass http://backend:5001; }
    location ^~ /uploads/ { proxy_pass http://backend:5001; }

    location / { try_files $uri $uri/ /index.html; }
}
